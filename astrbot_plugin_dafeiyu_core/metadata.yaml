name: "astrbot_plugin_dafeiyu_core"
display_name: "大肥鱼人格核心"
short_desc: "主人识别 + 兴趣机制 + 群聊唤醒/续聊 + 看人看全 + 群档案知识库 + 人味化 + 睡眠模式 + 全量备份/压缩恢复，统一配置与查看页面"
desc: "把大肥鱼系列插件整合为一个：主人身份与听令规则；群聊关键词唤醒、随机搭话、续聊与热闹加成；人味化输出清洗；兴趣库与自主搜索记录（短期观察→升级→自动清理）；联网搜索；睡眠模式（1 点起只记不回、2 点后连主人消息也排队、早上 6 点后随机醒来补回，晚安只回「安」）；全量资料备份（人格/兴趣/会话/发言记录/压缩状态/表情包清单，每晚睡眠时间 3 点自动备份、只留最新 3 份）；私聊上下文快满提醒、确认后压缩；群聊到点/安静后/余量高时自动压缩；群聊看人看全（记录每条发言的说话人、用视觉模型转述别人发的图片/表情、对非主人可回怼）；群档案知识库（每晚 3:40 汇总每个群的群友昵称外号、黑话梗与近期话题，聊天时自动注入，/群档案 可查看与即时更新）；每晚私聊报告每个对话的上下文用量与费用。自带统一配置与查看页面（插件详情页 View 标签）。"
version: "2.4.1"
author: "dsh"
repo: "https://github.com/acceleratorcxy/astrbot_plugin_dafeiyu_core"
support_platforms:
  - aiocqhttp
  - qq_official
  - webchat
astrbot_version: ">=4.16,<5"
